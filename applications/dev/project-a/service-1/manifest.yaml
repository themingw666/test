apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-1-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cdtmcqg
    app.kubernetes.io/environment: development
spec:
  project: default
  source:
    repoURL: https://github.com/themingw666/test.git
    targetRevision: argocd
    path: environments/dev/project-a/service-1
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      [
        ServerSideApply=true,
        ApplyOutOfSyncOnly=true,
        RespectIgnoreDifferences=true,
      ]
